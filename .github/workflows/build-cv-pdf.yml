name: Validate CV PDF

on:
  push:
    branches: [main]
    paths:
      - 'NgoQuangKiet_CV_FINAL.pdf'
      - 'scripts/validate_cv_pdf.py'
      - '.github/workflows/build-cv-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved A4 CV PDF
        run: |
          python -m pip install --quiet pypdf==6.10.0
          python scripts/validate_cv_pdf.py
